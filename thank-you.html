<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU Quiz - Thank You</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="page" id="page3">
            <div class="thank-you-content">
                <h1>Thank You!</h1>
                <p class="thank-you-message">Your answer has been submitted successfully.</p>
                
                <div class="checkmark">✓</div>
                
                <p>We appreciate your participation in today's quiz.</p>
                <p>Come back tomorrow for another challenge!</p>
                
                <div class="navigation">
                    <button class="btn-secondary" onclick="goBackToQuiz()">Back to Quiz</button>
                    <button class="btn-secondary" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="thank-you-script.js"></script>
</body>
</html>
